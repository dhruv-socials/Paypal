<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#231C5C">
  <title>Mandate · Your AI shopper, on a signed budget</title>
  <meta name="description" content="Give an AI shopping agent a signed spending mandate. Every purchase is checked before it reaches PayPal.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%23231C5C'/><path d='M9 22V10l7 7 7-7v12' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/></svg>">
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <div class="app">
    <aside class="sidebar" aria-label="Main">
      <a class="brand" href="#/home" aria-label="Mandate home">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9"/><path d="M9 22V10l7 7 7-7v12"/></svg>
        <span>Mandate</span>
      </a>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot" id="env-card"></div>
    </aside>

    <div class="main">
      <header class="appbar">
        <a class="appbar-brand" href="#/home" aria-label="Mandate home">
          <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9"/><path d="M9 22V10l7 7 7-7v12"/></svg>
        </a>
        <div class="appbar-title">
          <h1 id="page-title">Home</h1>
          <p id="page-sub"></p>
        </div>
        <div class="appbar-actions">
          <span id="mode-pill" class="pill" hidden></span>
          <a href="#/approvals" class="icon-btn" id="bell" aria-label="Approvals">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>
            <span class="bell-count" id="bell-count" hidden></span>
          </a>
          <span class="avatar" title="Demo shopper" aria-label="Demo shopper">DS</span>
        </div>
      </header>

      <main id="content" tabindex="-1">
        <section class="view" data-view="home" id="v-home"></section>

        <section class="view view-agent" data-view="agent" id="v-agent" hidden>
          <div class="agent-layout">
            <div class="chat">
              <div class="chat-head">
                <span class="agent-avatar" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><path d="M12 3v3M7 9h10a3 3 0 0 1 3 3v4a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3v-4a3 3 0 0 1 3-3z"/><circle cx="9" cy="14" r="1.2"/><circle cx="15" cy="14" r="1.2"/></svg>
                </span>
                <div class="chat-id">
                  <p class="chat-name">Shopping agent</p>
                  <p class="chat-sub" id="agent-sub">Spends only within your mandate</p>
                </div>
                <div class="segmented" role="tablist" aria-label="Agent view">
                  <button role="tab" class="seg is-active" aria-selected="true" data-seg="chat">Chat</button>
                  <button role="tab" class="seg" aria-selected="false" data-seg="store">Store</button>
                </div>
              </div>

              <div class="chat-body" id="chat-body" aria-live="polite"></div>

              <div class="store" id="store" hidden>
                <div class="store-bar">
                  <input id="store-search" class="input" type="search" placeholder="Search the store" aria-label="Search the store">
                  <p class="store-note">Buying here sends the same signed request the agent would. The gateway checks it the same way.</p>
                </div>
                <ul class="store-grid" id="store-grid"></ul>
              </div>

              <form class="composer" id="composer">
                <div class="chips" id="chips"></div>
                <div class="composer-row">
                  <textarea id="task" rows="1" placeholder="Ask your agent…" aria-label="Message the agent"></textarea>
                  <button class="send" id="send" type="submit" aria-label="Send">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                  </button>
                </div>
                <label class="hardened" id="hardened-wrap" hidden><input type="checkbox" id="hardened" checked> Warn the agent that product pages are untrusted</label>
              </form>
            </div>
            <aside class="agent-rail" id="agent-rail" aria-label="Your mandate"></aside>
          </div>
        </section>

        <section class="view" data-view="approvals" id="v-approvals" hidden></section>
        <section class="view" data-view="activity" id="v-activity" hidden></section>
        <section class="view" data-view="mandates" id="v-mandates" hidden></section>
        <section class="view" data-view="security" id="v-security" hidden></section>
      </main>
    </div>

    <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden></div>
  <div class="toast" id="toast" role="status" hidden></div>
  <script src="/static/app.js" defer></script>
</body>
</html>
